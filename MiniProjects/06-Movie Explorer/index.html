<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <h1>Movie Explorer</h1>
    <p class="tagline">Discover your next favorite movie</p>
  </header>

  <!-- Search Section -->
  <section class="search-section">
    <input type="text" id="movieSearch" placeholder="Search for a movie...">
    <button type ="button" id="searchButton">Search</button>
  </section>

  <!-- Status Area (for loading / error / empty messages) -->
  <p id="statusMessage"></p>

  <!-- Movie Results -->
  <main id="movieResults" class="movie-grid">

    <!-- 
      Example placeholder cards below.
      These are static for design purposes only.
      In the real project, these cards will be generated 
      dynamically with JavaScript based on API results.
    -->

    <article class="movie-card">
      <img class="movie-poster" src="https://placehold.co/300x445" alt="Movie poster">
      <div class="movie-info">
        <h2 class="movie-title">Inception</h2>
        <p class="movie-meta">2010 | Sci-Fi</p>
        <p class="movie-rating">Rating: 8.8</p>
        <button type ="button" class="details-button">View Details</button>
      </div>
    </article>

    <article class="movie-card">
      <img class="movie-poster" src="https://placehold.co/300x445" alt="Movie poster">
      <div class="movie-info">
        <h2 class="movie-title">The Dark Knight</h2>
        <p class="movie-meta">2008 | Action</p>
        <p class="movie-rating">Rating: 9.0</p>
        <button type ="button" class="details-button">View Details</button>
      </div>
    </article>

    <article class="movie-card">
      <img class="movie-poster" src="https://placehold.co/300x445" alt="Movie poster">
      <div class="movie-info">
        <h2 class="movie-title">Interstellar</h2>
        <p class="movie-meta">2014 | Adventure</p>
        <p class="movie-rating">Rating: 8.6</p>
        <button type ="button" class="details-button">View Details</button>
      </div>
    </article>

  </main>

  <!-- Movie Details Modal (hidden by default) -->
  <section id="movieDetails" class="hidden">
    <div class="details-container">
      <button id="closeDetails">&times;</button>
      <img class="details-poster" src="" alt="Movie poster">
      <h2 class="details-title"></h2>
      <p class="details-year"></p>
      <p class="details-genre"></p>
      <p class="details-rating"></p>
      <p class="details-plot"></p>
    </div>
  </section>
  <script src = "script.js"></script>

</body>
</html>
